[package]
name = "quby-render-queue"
version = "1.3.0"
edition = "2021"

[[bin]]
name = "QubyRenderQueue"
path = "src/main.rs"

[dependencies]
eframe = "0.27"
egui = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
